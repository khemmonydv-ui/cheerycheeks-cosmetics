<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 50" width="280" height="50">
  <defs>
    <style>
      .brand-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 24px;
        font-weight: 500;
        fill: #5B5466;
        letter-spacing: -0.3px;
      }
    </style>
  </defs>

  <!-- Cherry Icon Group -->
  <g transform="translate(5, 5)">
    <!-- Stems & Leaf -->
    <path d="M 18 10 C 20 18, 12 28, 12 28" fill="none" stroke="#7E57C2" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 18 10 C 22 18, 26 28, 26 28" fill="none" stroke="#7E57C2" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 18 10 Q 25 5, 28 8 Q 23 14, 18 10 Z" fill="#7E57C2" />

    <!-- Left Cherry -->
    <circle cx="11" cy="28" r="7.5" fill="#7E57C2" />

    <!-- Right Cherry -->
    <circle cx="27" cy="28" r="7.5" fill="#7E57C2" />
  </g>

  <!-- Brand Name -->
  <text x="50" y="32" class="brand-text">Cherry Cheeks</text>
</svg>